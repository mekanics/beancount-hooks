[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "beancount-hooks"
version = "0.6.1"
description = "Rule-based beangulp import hooks for Beancount v3"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "beancount>=3.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[dependency-groups]
dev = [
    "beangulp>=0.2.0",
    "pre-commit>=4.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/mekanics/beancount-hooks"
Repository = "https://github.com/mekanics/beancount-hooks"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
known-first-party = ["beancount_hooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
