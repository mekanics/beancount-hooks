[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beancount-hooks"
version = "0.1.0"
description = "Rule-based beangulp import hooks for Beancount v3"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "beancount>=3.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[dependency-groups]
dev = [
    "beangulp>=0.2.0",
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "ruff>=0.11.0",
]

[project.urls]
Homepage = "https://github.com/mekanics/beancount-hooks"
Repository = "https://github.com/mekanics/beancount-hooks"

[tool.hatch.build.targets.wheel]
packages = ["src/beancount_hooks"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
known-first-party = ["beancount_hooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
